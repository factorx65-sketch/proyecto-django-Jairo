{% extends "base.html"%}

{% block content %}

<div class="container text-center justify-content-center"></div>
    <form class="form-control" method="POST "  action="{% url 'detalleTarea' tarea.id %}">
       {% csrf_token %}
    <div class="mb-3">
        <label for="" class="form-label">titulo</label>
        <input
            type="text"
            class="form-control"
            name="titulo"
            id="titulo"
            aria-describedby="helpId"
           value="{{tareas.Titulo}}"
           required
    />
     </div>
     <div class="mb-3">
                <label for="" class="form-label">Descripcion</label>
                <textarea class="form-control" name="descricion"id="descricion" rows="3" required >{{tareas.descricion}}</textarea>
        </div>
         <div class="mb-3">
                <label for="" class="form-label">Name</label>
                <input
                    type="date"
                    class="form-control"
                    name="fecha"
                    id="fecha"
                    aria-describedby="helpId"
                    value="{{tarea.fecha| date:'Y-m-d'}}"
                    required
                />
                 </div>
           
            <div class="container">
               <input tipe="submit" class="btn btn-success" value="cargar"/>

             </div>   
            </form>
    
    



{% endblock content %}
